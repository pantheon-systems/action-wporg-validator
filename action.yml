name: WP.org Plugin & Theme Validator
description: Runs the WP.org Code Analysis Tool on your plugin or theme.
author: pantheon-systms
branding:
  icon: eye
  color: yellow
inputs:
  type:
    description: The type of code to validate. Either "plugin" or "theme" (deprecated, only "plugin" is supported).
    required: false
    default: 'plugin'
    type: string
  path:
    description: 'The path to the plugin to check.'
    required: false
    default: './'
    type: string
runs:
  using: composite
  steps:
    - name: Run WordPress Plugin Check
      uses: wordpress/plugin-check-action@v1.1.2
      with:
        build-dir: ${{ inputs.path }}
