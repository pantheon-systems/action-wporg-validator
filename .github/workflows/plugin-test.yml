name: Plugin Test
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    name: Plugin Test
    steps:
      - uses: actions/checkout@v4
      - name: Download and test a plugin
        run: |
          git svn clone https://plugins.svn.wordpress.org/progress-bar/trunk ./progress-bar
      - uses: ./
        with:
          type: plugin